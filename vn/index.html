<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo por Grupos</title>

    <!-- 1. BLOQUE ANTI-CACHÉ (Obliga a Chrome y Claro a pedir la página limpia) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- 2. CSS CON VERSIÓN Y RUTA RELATIVA EXPLÍCITA -->
    <link rel="stylesheet" href="./style.css?v=1.0">
</head>
<body>

    <header>
        <h1>Distribuidora Ruby</h1>
    </header>

    <!-- Banner de Presentación -->
    <div class="banner-container">
        <img src="./imagenes/presentacion.jpg" alt="Presentación Distribuidora Ruby" class="banner-img" onerror="this.style.display='none'">
    </div>

    <!-- Menú de Categorías -->
    <div id="menu-categorias"></div>

    <!-- Contenedor de Grupos y Productos -->
    <main id="contenedor-productos"></main>

    <!-- 3. SCRIPTS CON VERSIÓN (Cache Busting) -->
    <script src="./productos.js?v=1.0"></script>
    <script src="./app.js?v=1.0"></script>
</body>
</html>
