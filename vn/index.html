<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo VN</title>
    
    <!-- Cargamos la lista de productos directamente desde el archivo JS local -->
    <script src="productos.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .contenedor-general {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo para el Banner de presentación */
        .banner-container {
            width: 100%;
            max-height: 250px;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Cuadrícula de productos (Tarjetas) */
        .grilla-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Estilo de cada tarjeta de producto */
        .tarjeta {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.12);
        }

        /* Imagen arriba (ocupa todo el recuadro asignado) */
        .tarjeta-imagen-container {
            width: 100%;
            height: 180px;
            background-color: #f8f9fa;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }

        .tarjeta img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajuste perfecto llenando todo el recuadro */
        }

        /* Contenido de texto en orden */
        .tarjeta-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .codigo-cat {
            font-size: 11px;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
        }

        .descripcion {
            font-size: 14px;
            color: #2b2b2b;
            font-weight: 600;
            line-height: 1.3;
            height: 2.6em; /* Altura fija de dos líneas */
            overflow: hidden;
        }

        .presentacion {
            font-size: 12px;
            color: #666;
            background: #e9ecef;
            padding: 3px 6px;
            border-radius: 4px;
            align-self: flex-start;
        }

        /* Precio abajo */
        .precio {
            font-size: 18px;
            font-weight: bold;
            color: #2a9d8f;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #eee;
            text-align: right;
        }

        /* Botón flotante para guardar en PDF */
        .btn-flotante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: background 0.2s;
        }

        .btn-flotante:hover {
            background-color: #d62828;
        }

        /* Configuración para imprimir o guardar en PDF */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .contenedor-general {
                max-width: 100%;
            }
            .btn-flotante {
                display: none;
            }
            .tarjeta {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>

    <div class="contenedor-general">
        <!-- Banner superior -->
        <div class="banner-container">
            <img src="Imagenes/presentacion.jpg" alt="Catálogo VN" onerror="this.style.display='none'">
        </div>

        <div class="grilla-productos" id="grilla">
            <!-- Las tarjetas se generan solas aquí -->
        </div>
    </div>

    <button class="btn-flotante" onclick="window.print()">🖨 Guardar Catálogo en PDF</button>

    <script>
        // Función que dibuja el catálogo usando el archivo productos.js
        function generarCatalogo() {
            const grilla = document.getElementById('grilla');
            grilla.innerHTML = "";

            if (typeof listaProductos === 'undefined' || listaProductos.length === 0) {
                grilla.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #777;">No hay productos cargados en el archivo productos.js</p>`;
                return;
            }

            listaProductos.forEach(prod => {
                let rutaImg = prod.imagen ? `Imagenes/${prod.imagen}.jpg` : 'Imagenes/sin_foto.jpg';

                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                
                tarjeta.innerHTML = `
                    <div>
                        <div class="tarjeta-imagen-container">
                            <img src="${rutaImg}" alt="${prod.descripcion}" onerror="this.src='Imagenes/sin_foto.jpg'">
                        </div>
                        <div class="tarjeta-info">
                            <div class="codigo-cat">${prod.categoria} &bull; Cód: ${prod.cod_art}</div>
                            <div class="descripcion" title="${prod.descripcion}">${prod.descripcion}</div>
                            <div class="presentacion">${prod.presentacion}</div>
                        </div>
                    </div>
                    <div class="precio">$ ${prod.precio.toLocaleString('es-AR', {minimumFractionDigits: 2})}</div>
                `;

                grilla.appendChild(tarjeta);
            });
        }

        // Ejecutar al cargar la página
        window.onload = generarCatalogo;
    </script>

</body>
</html>
